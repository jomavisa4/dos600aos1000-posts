name: Postbot Cloud (Feed + Stories)

on:
  schedule:
    # Crons fora do minuto :00 + worker continuo de 5h30 (mesma estrategia estavel do keepalive)
    - cron: '13 */2 * * *'
    - cron: '47 11,16,20,22 * * *' # 13 min antes de 09h, 14h, 18h e 20h BRT
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Modo teste (true = valida sem publicar; false = inicia worker na nuvem)'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: postbot-cloud
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Baixar fila e imagens
        uses: actions/checkout@v4

      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Teste rapido sem publicar (dry-run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_IG_ID: ${{ secrets.META_IG_ID }}
          PUBLIC_IMAGE_BASE: https://raw.githubusercontent.com/jomavisa4/dos600aos1000-posts/main
          OFFER_URL: https://dos600aos1000.onrender.com
          HANDLE: '@dos600aos1000'
          DRY_RUN: 'true'
        run: node cloud-publish.mjs

      - name: Worker na nuvem (09:00 / 14:00 / 18:00 / 20:00 BRT)
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_IG_ID: ${{ secrets.META_IG_ID }}
          PUBLIC_IMAGE_BASE: https://raw.githubusercontent.com/jomavisa4/dos600aos1000-posts/main
          OFFER_URL: https://dos600aos1000.onrender.com
          HANDLE: '@dos600aos1000'
          SLOT_MODE: due
          DRY_RUN: 'false'
        run: |
          git config user.name "postbot-cloud"
          git config user.email "postbot-cloud@users.noreply.github.com"

          end=$((SECONDS + 330*60))
          while [ "$SECONDS" -lt "$end" ]; do
            git pull --rebase origin main || true
            rm -f .fila_concluida
            node cloud-publish.mjs || true

            if ! git diff --quiet queue.json; then
              git add queue.json
              git commit -m "postbot: atualizar fila ($(date -u +'%Y-%m-%d %H:%M UTC'))"
              git pull --rebase origin main || true
              git push origin HEAD:main
            fi

            if [ -f .fila_concluida ]; then
              echo "Fila semanal concluida — encerrando worker."
              break
            fi

            sleep 60
          done
          echo "Ciclo concluido"
